[project]
name = "f1lake"
version = "0.1.0"
description = "F1 Open Lakehouse: Iceberg on MinIO, Spark, DuckDB, Airflow, ClickHouse"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1",
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "pyyaml>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/f1lake"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs the running compose stack (make up)"]
addopts = "-m 'not integration'"

[tool.ruff]
line-length = 100
target-version = "py312"
