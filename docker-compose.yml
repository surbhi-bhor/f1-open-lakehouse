# Phase 0 stack: S3 storage, the Iceberg JDBC catalog, and Spark.
# Every port is bound to 127.0.0.1, so nothing is reachable from other devices on the network.
# Start with `make up` (batch profile). Never start every profile at once on a 16 GB laptop.

services:

  # Built from official source by .github/workflows/minio-image.yml (infra/minio/Dockerfile).
  minio:
    image: ${MINIO_IMAGE}:${MINIO_RELEASE}
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
      # Lets `mc ready local` in the healthcheck reach this server.
      MC_HOST_local: http://${S3_ACCESS_KEY}:${S3_SECRET_KEY}@127.0.0.1:9000
    ports:
      - "127.0.0.1:9000:9000"   # S3 API
      - "127.0.0.1:9001:9001"   # web console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 512m

  # One-shot: creates the buckets. --ignore-existing makes it safe to re-run.
  minio-init:
    image: ${MINIO_IMAGE}:${MINIO_RELEASE}
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MC_HOST_local: http://${S3_ACCESS_KEY}:${S3_SECRET_KEY}@minio:9000
    entrypoint: ["mc", "mb", "--ignore-existing", "local/warehouse", "local/landing"]
    mem_limit: 128m

  postgres:
    image: ${POSTGRES_IMAGE}
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    # 5433 on the host: the content-intelligence pipeline already holds 5432.
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 512m

  # shortcut: local[2] in one idle container, no standalone master/worker; upgrade when streaming and batch must run together
  spark:
    image: ${SPARK_IMAGE}
    profiles: ["batch", "streaming"]
    # Root so the named Ivy cache volume is writable; local-only container.
    user: root
    entrypoint: ["sleep", "infinity"]
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PG_HOST: postgres
      PG_PORT: "5432"
      S3_ENDPOINT: http://minio:9000
      PYTHONPATH: /opt/project/src
    volumes:
      - .:/opt/project
      - ivy_cache:/opt/ivy
    depends_on:
      minio-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    mem_limit: 3g

volumes:
  minio_data:
  postgres_data:
  ivy_cache:
