# Phase 0 stack: S3 storage, the Iceberg JDBC catalog, and Spark.
# Every port is bound to 127.0.0.1, so nothing is reachable from other devices on the network.
# Start with `make up` (batch profile). Never start every profile at once on a 16 GB laptop.

services:

  seaweedfs:
    image: ${SEAWEEDFS_IMAGE}
    # Credentials come from .env, so the S3 identity file is written at start rather than committed.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        printf '{"identities":[{"name":"admin","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}' \
          "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" > /tmp/s3.json
        exec weed server -dir=/data -s3 -s3.port=8333 -s3.config=/tmp/s3.json -volume.max=0 -master.volumeSizeLimitMB=256
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    ports:
      - "127.0.0.1:8333:8333"   # S3 API
      - "127.0.0.1:8888:8888"   # filer UI, for browsing buckets
    volumes:
      - seaweedfs_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8333/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 512m

  # One-shot: creates the buckets. Safe to re-run, since existing buckets are skipped.
  seaweedfs-init:
    image: ${SEAWEEDFS_IMAGE}
    depends_on:
      seaweedfs:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for b in warehouse landing; do
          if echo "s3.bucket.list" | weed shell -master=seaweedfs:9333 | grep -qw "$$b"; then
            echo "bucket $$b exists"
          else
            echo "s3.bucket.create -name $$b" | weed shell -master=seaweedfs:9333
          fi
        done
    mem_limit: 128m

  postgres:
    image: ${POSTGRES_IMAGE}
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    # 5433 on the host: the content-intelligence pipeline already holds 5432.
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 512m

  # shortcut: local[2] in one idle container, no standalone master/worker; upgrade when streaming and batch must run together
  spark:
    image: ${SPARK_IMAGE}
    profiles: ["batch", "streaming"]
    # Root so the named Ivy cache volume is writable; local-only container.
    user: root
    entrypoint: ["sleep", "infinity"]
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PG_HOST: postgres
      PG_PORT: "5432"
      S3_ENDPOINT: http://seaweedfs:8333
      PYTHONPATH: /opt/project/src
    volumes:
      - .:/opt/project
      - ivy_cache:/opt/ivy
    depends_on:
      seaweedfs-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    mem_limit: 3g

volumes:
  seaweedfs_data:
  postgres_data:
  ivy_cache:
